<!DOCTYPE html>

<html lang="en">
    <head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=windows-1252">
    
        <title>Weather App</title>
        <link rel="stylesheet" href="style.css">
       
    </head>
    <body style="background-color:rgb(53, 74, 75);">
        <div class="card" > 
            <div class="search">
                <input type="text" placeholder="enter the city " spellcheck="false">
                <button><img src="search.png" width="50" height="50" class="search-icon"></button>
            </div>
        
       <div class="weather">
        <img src=" kdkd.png"  width="150" height="150" class="weather-icon">
        <h1 class="temp">__°C</h1>
        <h2 class="city">-</h2>
        <div style="display: flex; ">
            <p id="humi" style="color :white;">Humidity</p>
            <p id="win" style="color :white;">Wind</p>
          </div>
          
         
         <div style="display: flex; ">
            <p ><img src="humidity.png" width="100" height="50" class="humidity-icon"></p>
            <p > <img src="wind.png" width="100" height="50" class="wind-icon"></p>
          </div>
         <div>
            <div style="display: flex; ">
                <p class="humidity">-</p>
                <p class="wind" >- </p>
              </div>
         
         </div>
       </div> 
    </div>
   <script>
    const apikey="Paste APi key here ";
    const apiUrl="Paste api url here";
    
    const searchbox=document.querySelector(".search input")
    const searchBtn=document.querySelector(".search button") 
    const weatherIcon = document.querySelector(".weather-icon")
    async function checkweather(city) {
        const response= await fetch(apiUrl + city + `&appid=${apikey}`);
        var data =await response.json();

        console.log(data); 
       document.querySelector(".city").innerHTML=data.name;
       document.querySelector(".temp").innerHTML=parseInt(Math.round(data.main.temp) / 10); + "°C";
       document.querySelector(".humidity").innerHTML=data.main.humidity +"%";
       document.querySelector(".wind").innerHTML=data.wind.speed + "KM/H";

       if(data.weather[0].main=="Clouds")
       {
        weatherIcon.src="clouds.png";
       }
        else if(data.weather[0].main=="Clear")
       {
        weatherIcon.src="clear.png";
       }
        else if(data.weather[0].main=="Rain")
       {
        weatherIcon.src="rain.png";
       }
       else if(data.weather[0].main=="Mist")
       {
        weatherIcon.src="mist.png";
       }
       else if(data.weather[0].main=="Snow")
       {
        weatherIcon.src="snow.png";
       }
    }


    searchBtn.addEventListener("click", ()=>{
        checkweather(searchbox.value);
    })
    //checkweather();
   </script> 
</body>
</html>
